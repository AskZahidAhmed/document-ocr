[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "document-ocr"
version = "0.1.0"
description = "Open-source document OCR pipeline for extracting text from images and scanned PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "Pillow>=10.0",
    "pytesseract>=0.3.13",
    "pypdf>=5.0",
    "PyMuPDF>=1.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
]


[project.scripts]
document-ocr = "document_ocr.cli.main:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88


[tool.coverage.run]
source = ["document_ocr"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 70
